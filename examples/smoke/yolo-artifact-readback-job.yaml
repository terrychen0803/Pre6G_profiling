apiVersion: batch/v1
kind: Job
metadata:
  name: yolo-artifact-readback
  namespace: profiling
  labels:
    app.kubernetes.io/name: yolo-artifact-readback
    profile-job-builder.local/test-phase: phase-4
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yolo-artifact-readback
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: gx10-c206
      containers:
        - name: readback
          image: busybox:1.36
          command:
            - /bin/sh
            - -ceu
          args:
            - |
              output=/profile-output/yolo26-train-profile-run2
              test -s "$output/profile.nsys-rep"
              test -s "$output/nsys-stats.txt"
              test -s "$output/nsys-stats.csv"
              test -s "$output/profile-metadata.json"
              wc -c \
                "$output/profile.nsys-rep" \
                "$output/nsys-stats.txt" \
                "$output/nsys-stats.csv" \
                "$output/profile-metadata.json"
              sha256sum "$output/profile.nsys-rep"
              printf 'yolo-artifact-persistence-ok\n'
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 65532
          volumeMounts:
            - name: profile-output
              mountPath: /profile-output
              readOnly: true
      volumes:
        - name: profile-output
          persistentVolumeClaim:
            claimName: profile-artifacts
