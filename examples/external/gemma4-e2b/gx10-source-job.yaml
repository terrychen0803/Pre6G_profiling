apiVersion: batch/v1
kind: Job
metadata:
  name: external-gemma4-e2b
  namespace: profiling
  labels:
    phase6.pre6g.local/case: gemma4-e2b
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        phase6.pre6g.local/case: gemma4-e2b
    spec:
      restartPolicy: Never
      initContainers:
        - name: install-transformers
          image: ultralytics/ultralytics:8.4.104-nvidia-arm64@sha256:7db35781a755d11717f67b085f71b9b2ddee6c491c958e76e2526597a85b4757
          command:
            - /bin/sh
          args:
            - -ceu
            - |
              python3 -m pip install \
                --disable-pip-version-check \
                --no-cache-dir \
                --target /python-deps \
                "transformers>=5.4,<6" \
                "accelerate>=1.10,<2" \
                "compressed-tensors>=0.12,<1" \
                "sentencepiece>=0.2,<1"
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
          volumeMounts:
            - name: python-deps
              mountPath: /python-deps
      containers:
        - name: trainer
          image: ultralytics/ultralytics:8.4.104-nvidia-arm64@sha256:7db35781a755d11717f67b085f71b9b2ddee6c491c958e76e2526597a85b4757
          imagePullPolicy: IfNotPresent
          workingDir: /workspace
          command:
            - python3
          args:
            - -c
            - |
              import torch
              from transformers import AutoModelForMultimodalLM, AutoProcessor

              model_id = "unsloth/gemma-4-E2B-it-qat-w4a16"
              revision = "123e194"
              assert torch.cuda.is_available(), "CUDA is required"
              processor = AutoProcessor.from_pretrained(
                  model_id,
                  revision=revision,
              )
              model = AutoModelForMultimodalLM.from_pretrained(
                  model_id,
                  revision=revision,
                  dtype="auto",
                  device_map="cuda",
              )
              messages = [
                  {
                      "role": "user",
                      "content": "In one sentence, explain why GPU profiling is useful.",
                  }
              ]
              inputs = processor.apply_chat_template(
                  messages,
                  tokenize=True,
                  return_dict=True,
                  return_tensors="pt",
                  add_generation_prompt=True,
                  enable_thinking=False,
              ).to(model.device)
              with torch.inference_mode():
                  output = model.generate(**inputs, max_new_tokens=32)
              torch.cuda.synchronize()
              generated = processor.decode(
                  output[0][inputs["input_ids"].shape[-1]:],
                  skip_special_tokens=True,
              )
              print(f"phase6-gemma4-complete output={generated!r}")
          env:
            - name: PYTHONPATH
              value: /python-deps
            - name: HF_HOME
              value: /model-cache
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"
            - name: TOKENIZERS_PARALLELISM
              value: "false"
          resources:
            requests:
              cpu: "2"
              memory: 12Gi
              nvidia.com/gpu.shared: "1"
            limits:
              cpu: "8"
              memory: 32Gi
              nvidia.com/gpu.shared: "1"
          volumeMounts:
            - name: python-deps
              mountPath: /python-deps
              readOnly: true
            - name: model-cache
              mountPath: /model-cache
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: python-deps
          emptyDir: {}
        - name: model-cache
          emptyDir:
            sizeLimit: 14Gi
        - name: workspace
          emptyDir: {}
