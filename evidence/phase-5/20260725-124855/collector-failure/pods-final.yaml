        nsys_binary="${NSYS_BINARY_OVERRIDE:-/opt/profiler/nsys/target-linux-sbsa-armv8/nsys}"
        required_reports="${PROFILE_REQUIRED_REPORTS:-osrt_sum cuda_api_sum cuda_gpu_kern_sum cuda_gpu_mem_time_sum cuda_gpu_mem_size_sum}"
        report_exists=false
        report_size_bytes=0
        report_valid=false
        stats_complete=false
        expected_checksum=
        actual_checksum=
        checksum_match=false
        application_exit_code=

        write_metadata() {
          overall_status=$1
          failure_reason=$2
          collector_exit_code=$3
          nsys_version=$("$nsys_binary" --version 2>/dev/null | head -n 1 | tr '"' "'" || true)
          finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf '{"status":"%s","overall_status":"%s","failure_reason":"%s","application_exit_code":%s,"report_exists":%s,"report_size_bytes":%s,"report_valid":%s,"expected_checksum":"%s","actual_checksum":"%s","checksum_match":%s,"stats_complete":%s,"collector_exit_code":%s,"nsys_version":"%s","finished_at":"%s"}\n'     "$overall_status" "$overall_status" "$failure_reason"     "${application_exit_code:-null}" "$report_exists" "$report_size_bytes"     "$report_valid" "$expected_checksum" "$actual_checksum" "$checksum_match"     "$stats_complete" "$collector_exit_code" "$nsys_version" "$finished_at"     > "$metadata"
        }

        await_collection_ack() {
          result=$1
          touch "$ready"
          collection_deadline=$(( $(date +%s) + 3600 ))
          while [ ! -f "$ack" ]; do
            if [ "$(date +%s)" -ge "$collection_deadline" ]; then
              failure_reason=collection_ack_timeout
              write_metadata failed "$failure_reason" 125
              exit 125
            fi
            sleep 2
          done
          exit "$result"
        }

        fail_collection() {
          failure_reason=$1
          collector_exit_code=$2
          write_metadata failed "$failure_reason" "$collector_exit_code"
          await_collection_ack "$collector_exit_code"
        }

        deadline=$(( $(date +%s) + 3600 ))
        while [ ! -f "$application_finished" ]; do
          if [ "$(date +%s)" -ge "$deadline" ]; then
            fail_collection application_timeout 124
          fi
          sleep 2
        done

        application_exit_code=$(cat "$application_finished")
        case "$application_exit_code" in
          ''|*[!0-9]*) fail_collection invalid_application_exit_code 126 ;;
        esac

        if [ ! -e "$report" ]; then
          fail_collection missing_report 20
        fi
        report_exists=true
        report_size_bytes=$(wc -c < "$report")
        if [ "$report_size_bytes" -eq 0 ]; then
          fail_collection empty_report 21
        fi

        if [ ! -s "$expected_checksum_file" ]; then
          fail_collection expected_checksum_missing 22
        fi
        expected_checksum=$(cat "$expected_checksum_file")
        set -- $(sha256sum "$report")
        actual_checksum=$1
        if [ "$expected_checksum" != "$actual_checksum" ]; then
          fail_collection integrity_failure 23
        fi
        checksum_match=true

        mkdir -p /profile-output/phase5-colfail-20260725-124855/tmp-collector
        export TMPDIR=/profile-output/phase5-colfail-20260725-124855/tmp-collector
        parts=/profile-output/phase5-colfail-20260725-124855/stats-parts
        mkdir -p "$parts"
        : > "$stats_stderr"

        run_stats() {
          stats_report_name=$1
          stats_format=$2
          stats_output=$3
          stats_error="$stats_output.stderr"
          if [ "$stats_format" = csv ]; then
            "$nsys_binary" stats --force-export=true --format=csv       --report="$stats_report_name" "$report"       > "$stats_output" 2> "$stats_error"
            stats_exit=$?
          else
            "$nsys_binary" stats --force-export=true --report="$stats_report_name" "$report"       > "$stats_output" 2> "$stats_error"
            stats_exit=$?
          fi
          cat "$stats_error" >> "$stats_stderr"
          if [ "$stats_exit" -ne 0 ] || [ ! -s "$stats_output" ]; then
            return 1
          fi
          if grep -Eiq 'Exportation error:|ERROR:' "$stats_output" "$stats_error"; then
            printf 'nsys stats emitted an error despite exit code %s:\n' "$stats_exit"       >> "$stats_stderr"
            cat "$stats_output" >> "$stats_stderr"
            return 1
          fi
          return 0
        }

        if ! run_stats osrt_sum text "$parts/report-validation.txt"; then
          header=$(head -c 28 "$report" || true)
          case "$header" in
            "NVIDIA Tegra Profiler Report"*) fail_collection corrupted_report 24 ;;
            *) fail_collection parse_failure 25 ;;
          esac
        fi
        report_valid=true

        required_reports_csv=$(printf '%s' "$required_reports" | tr ' ' ',')
        all_reports="$required_reports_csv,nvtx_sum"
        stats_text_candidate="$parts/nsys-stats.txt.partial"
        stats_csv_candidate="$parts/nsys-stats.csv.partial"
        if ! run_stats "$all_reports" text "$stats_text_candidate"; then
          fail_collection stats_failure 26
        fi
        if ! run_stats "$all_reports" csv "$stats_csv_candidate"; then
          fail_collection stats_failure 26
        fi

        for summary in   'OS Runtime Summary'   'CUDA API Summary'   'CUDA GPU Kernel Summary'   'CUDA GPU MemOps Summary (by Time)'   'CUDA GPU MemOps Summary (by Size)'; do
          if ! grep -Fq "$summary" "$stats_text_candidate"; then
            printf 'required summary missing: %s\n' "$summary" >> "$stats_stderr"
            fail_collection stats_failure 26
          fi
        done

        mv "$stats_text_candidate" /profile-output/phase5-colfail-20260725-124855/nsys-stats.txt
        mv "$stats_csv_candidate" /profile-output/phase5-colfail-20260725-124855/nsys-stats.csv
        stats_complete=true
        if [ "$application_exit_code" -ne 0 ]; then
          fail_collection application_exit_nonzero 27
        fi
        write_metadata success none 0
        await_collection_ack 0
