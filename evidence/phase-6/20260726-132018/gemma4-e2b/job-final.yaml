    spec:
      containers:
      - args:
        - |
          report=/profile-output/phase6-gemma4-20260726-132018/profile.nsys-rep
          set +e
          /opt/profiler/nsys/target-linux-sbsa-armv8/nsys profile   --trace=cuda,nvtx,osrt   --sample=none   --cpuctxsw=none   --force-overwrite=true   --output=/profile-output/phase6-gemma4-20260726-132018/profile   "$@"
          application_exit_code=$?
          set -e
          if [ -e "$report" ]; then
            set -- $(sha256sum "$report")
            printf '%s\n' "$1" > /profile-output/phase6-gemma4-20260726-132018/.expected-sha256
          fi
          printf '%s\n' "$application_exit_code" > /profile-output/phase6-gemma4-20260726-132018/.application-finished
          exit "$application_exit_code"
        - --
        - python3
        - -c
        - |
          import torch
          from transformers import AutoModelForMultimodalLM, AutoProcessor

          model_id = "unsloth/gemma-4-E2B-it-qat-w4a16"
          revision = "123e194"
          assert torch.cuda.is_available(), "CUDA is required"
          processor = AutoProcessor.from_pretrained(
              model_id,
              revision=revision,
          )
          model = AutoModelForMultimodalLM.from_pretrained(
              model_id,
              revision=revision,
              dtype="auto",
              device_map="cuda",
          )
          messages = [
              {
                  "role": "user",
                  "content": "In one sentence, explain why GPU profiling is useful.",
              }
          ]
          inputs = processor.apply_chat_template(
              messages,
              tokenize=True,
              return_dict=True,
              return_tensors="pt",
              add_generation_prompt=True,
              enable_thinking=False,
          ).to(model.device)
          with torch.inference_mode():
              output = model.generate(**inputs, max_new_tokens=32)
          torch.cuda.synchronize()
          generated = processor.decode(
              output[0][inputs["input_ids"].shape[-1]:],
              skip_special_tokens=True,
          )
          print(f"phase6-gemma4-complete output={generated!r}")
        command:
        - /bin/sh
        - -ceu
        env:
        - name: PYTHONPATH
          value: /python-deps
        - name: HF_HOME
          value: /model-cache
        - name: HF_HUB_DISABLE_TELEMETRY
          value: "1"
        - name: TOKENIZERS_PARALLELISM
